product: mekras/ai-dev-team
applied_version: 0.22.1
updated_at: 2026-07-30
setup:
  operating_context:
    kind: noncommercial
  impact_graph:
    status: present
    path: project-impact.json
    schema_version: 2
  project_profile:
    forms: [apm-skill-collection, documentation]
    users: [project-developers]
    interfaces: [apm, ai-agent-prompts]
    delivery: [public-apm-package]
  visibility: public
  git:
    enabled: true
  commit_messages:
    scheme: pro-git
  changelog:
    status: present
    path: CHANGELOG.md
  decision_records:
    status: present
    journals:
      - kind: ADR
        path: docs/ADR/
        record_pattern: ADR-NNNN.md
        index: docs/ADR/README.md
  knowledge:
    status: declined
