      - name: правила для агентов и клиентские инструкции
        status: сделано
        basis: рукописный AGENTS.md и ссылка на него из CLAUDE.md
        evidence: самопроверка ai-audit-agent-rules охватила корневые инструкции, их связь с маршрутизатором, навыком общения, состоянием и локальной политикой; отключение подагентов имеет приоритет над условной процедурой их запуска; обе проекции доступны; строгий аудит APM — код 0
        limitations: [поведение новой корневой сессии не испытывалось]
      - name: журнал изменений
        status: сделано
        basis: setup.changelog указывает на CHANGELOG.md
        evidence: самопроверка ait-changelog подтвердила существующий раздел Невыпущено и рабочее правило в AGENTS.md; изменение оснастки разработки и тестового контракта не меняет пользовательское поведение коллекции, запись о продуктовой возможности не требуется
        limitations: []
      - name: журналы решений
        status: сделано
        basis: setup.decision_records указывает на docs/ADR/
        evidence: самопроверка ait-decisions подтвердила архитектурную границу коллекции в README журнала, все 12 записей в реестре, допустимые статусы, варианты и последствия, условия пересмотра; временное отключение подагентов обратимо в текущей задаче и не требует отдельной DR
        limitations: [принятые архитектурные решения заново не пересматривались]
      - name: корпус знаний
        status: отложено
        basis: ранее принятое решение setup.knowledge.status — declined
        evidence: отказ сохранён в отслеживаемом состоянии проекта
        limitations: [основания собственного корпуса не использовались]
      - name: разработка на основе спецификаций
        status: не требуется
        basis: прямого запроса принять подход нет; проект уже имеет закреплённые границы и канонические исходники публикуемых навыков
        evidence: проверка условий ait-reconstructability сопоставила README.md, docs/architecture.md и .apm/skills; настройка не является ранним проектированием и не ставит задачу восстановления реализации по спецификации; генерация проекций APM не требует принятия нового подхода
        limitations: [разработка на основе спецификаций не объявлена принятой, восстановление реализации не испытывалось]
      - name: граф влияния и указатель
        status: сделано
        basis: AGENTS.md и setup.impact_graph указывают на project-impact.json
        evidence: impact_graph.py validate — код 0, coverage — 267 сопоставленных путей, несопоставленных нет
        limitations: []
      - name: .gitignore
        status: сделано
        basis: Git используется, проекции APM исключены
        evidence: git check-ignore подтвердил исключение локальной политики, настроек evals и проекций APM; git ls-files не обнаружил их в индексе; скомпилированные артефакты Python не найдены
        limitations: []
      - name: лицензия
        status: сделано
        basis: для публичной коллекции ранее выбрана MIT
        evidence: проверка организации лицензионных сведений через ait-licensing сопоставила LICENSE, README.md и apm.yml; обновлённые рабочие скрипты происходят из ai-agent-supervisor с MIT и тем же уведомлением об авторстве; ai-dev-team находится в devDependencies
        limitations: [правовая экспертиза всех ранее включённых материалов не проводилась]
      - name: подагенты
        status: не требуется
        basis: пользователь подтвердил цели политики и временно отключил подагентов 2026-10-23
        evidence: отключение закреплено в AGENTS.md и setup.subagents, CLAUDE.md подключает AGENTS.md
        limitations: [делегирование и техническая блокировка запусков не испытывались]
      - name: индекс Git, сообщения коммитов и проверки
        status: сделано
        basis: Git используется, принята схема pro-git и добавление всех неигнорируемых изменений
        evidence: все изменения добавлены в индекс; ограничения описаний 180 и 2200 с прежними переменными среды сохранены; комплект из 23 файлов совпадает с установленным источником; 8 сценариев kc-inventory и полная команда apm run tests завершились кодом 0; безопасный цикл и итоговый строгий аудит APM — код 0; изменённая оснастка отклонена в проверочных примерах для обеих проекций
        limitations: [модельные evals не запускались; сверка рабочих копий в tests явно пропускается без установленных зависимостей APM, как в существующем CI выпуска]
