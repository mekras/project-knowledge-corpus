name: project-knowledge-corpus
version: 0.23.0
description: Коллекция навыков для создания, сопровождения и применения корпуса знаний
  проекта
author: mekras
license: MIT
targets:
  - claude
  - codex
type: skill
includes: auto
dependencies:
  apm: []
  mcp: []
scripts:
  tests: sh -c 'set -e; export PYTHONDONTWRITEBYTECODE=1;
    target="${APM_EVAL_PATH:-.apm/skills}"; python3
    tools/validate-python-artifacts.py;
    if test -f .agents/skills/ai-setup-apm/scripts/eval-tools/check-eval-tools-drift.py;
    then python3 .agents/skills/ai-setup-apm/scripts/eval-tools/check-eval-tools-drift.py;
    elif test -f .claude/skills/ai-setup-apm/scripts/eval-tools/check-eval-tools-drift.py;
    then python3 .claude/skills/ai-setup-apm/scripts/eval-tools/check-eval-tools-drift.py;
    else echo "Сверка оснастки пропущена — зависимости APM не установлены."; fi; python3
    tools/validate-skill-descriptions.py "$target"
    --max-description-chars "${APM_SKILL_DESCRIPTION_MAX_CHARS:-180}"
    --max-total-chars "${APM_SKILL_DESCRIPTION_TOTAL_MAX_CHARS:-2200}"; python3
    tools/validate-hidden-unicode.py; python3 tools/validate-trigger-evals.py
    "$target" --require-all; python3 tools/validate-skill-result-evals.py
    "$target"; python3 tools/validate-skill-portability.py "$target"; python3
    tools/test-run-skill-evals.py; python3
    tools/test-apm-lock-artifacts.py; python3
    tools/validate-apm-lock-artifacts.py; python3
    tools/validate-portable-corpus-references.py; python3
    tools/test-corpus-layout-validator.py; python3 tools/test-source-admission.py; python3
    tools/test-corpus-operations.py; python3 tools/test-corpus-audit-regressions.py;
    python3 tools/test-corpus-statements.py;
    python3 tools/test-transcription-contract.py; python3
    tools/test-knowledge-evaluation.py; python3 tools/test-corpus-search.py; python3 tools/test-e5-adapter.py;
    if test -f .agents/skills/ai-setup-apm/scripts/eval-tools/run-skill-script-contract-tests.py;
    then python3 .agents/skills/ai-setup-apm/scripts/eval-tools/run-skill-script-contract-tests.py
    .apm/skills/kc-search;
    elif test -f .claude/skills/ai-setup-apm/scripts/eval-tools/run-skill-script-contract-tests.py;
    then python3 .claude/skills/ai-setup-apm/scripts/eval-tools/run-skill-script-contract-tests.py
    .apm/skills/kc-search;
    else echo "Контрактные проверки поиска пропущены — зависимости APM не установлены."; fi;
    python3 tools/test-script-utf8.py; python3
    tools/test-pyyaml-dependencies.py; python3
    tools/test-run-execution-class.py; python3 tools/test-apm-audit-ci.py'
  evals: python3 tools/run-skill-evals.py "${APM_EVAL_PATH:-.apm/skills}"
devDependencies:
  apm:
    - mekras/apm-marketplace/packages/ai-dev-team#ai-dev-team--v1.0.1
